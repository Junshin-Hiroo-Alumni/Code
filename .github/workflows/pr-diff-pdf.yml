name: Typst Visual PDF Diff

on:
  pull_request:
    paths:
      - "**/*.typ"

permissions:
  contents: read
  pull-requests: write

jobs:
  build-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Generate Typst Diff Source
        run: |
          python pr/.github/scripts/generate_typst_diff.py base/main.typ pr/main.typ pr/diff.typ

      - name: Compile Diff PDF
        run: |
          cd pr
          typst compile diff.typ diff.pdf

      - name: Upload Diff Artifact
        id: artifact-upload
        uses: actions/upload-artifact@v4
        with:
          name: typst-visual-diff
          path: pr/diff.pdf
          retention-days: 7

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: diff-pdf-link
          message: |
            ### 差分PDFが生成されました

            **[最新の差分PDFをダウンロード](${{ steps.artifact-upload.outputs.artifact-url }})**

            *(※このコメントは最新のPushに合わせて自動で上書き更新されます)*
