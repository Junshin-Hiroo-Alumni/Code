name: Typst Visual PDF Diff

on:
  pull_request:
    paths:
      - '**/*.typ'

jobs:
  build-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv

      - name: Compile Base Document
        run: typst compile base/main.typ base/old.pdf

      - name: Compile PR Document
        run: typst compile pr/main.typ pr/new.pdf

      - name: Generate PDF Diff
        run: |
          docker run --rm -v ${{ github.workspace }}:/work ghcr.io/nowsprinting/diff-pdf \
            --output-diff=/work/pr/diff.pdf /work/base/old.pdf /work/pr/new.pdf || true

      - name: Upload Diff Artifact
        uses: actions/upload-artifact@v4
        with:
          name: typst-visual-diff
          path: pr/diff.pdf
          retention-days: 7
